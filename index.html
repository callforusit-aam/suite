/* ---------- RISPOSTE ---------- */
function gmailLink(r){
  const u=encodeURIComponent(state.google.email||'');
  return r&&r.threadId?`https://mail.google.com/mail/?authuser=${u}#all/${r.threadId}`:`https://mail.google.com/mail/?authuser=${u}`;
}
function viewRisposte(){
  // aprendo la vista, le risposte nuove diventano "viste"
  let changed=false;state.contacts.forEach(c=>{if(c.haRisposto&&c.replySeen===false){c.replySeen=true;changed=true;}});
  if(changed){persist();setTimeout(renderNav,0);}
  const real=state.contacts.filter(c=>c.haRisposto).sort((a,b)=>String(b.reply?.date||'').localeCompare(String(a.reply?.date||'')));
  const autos=state.contacts.filter(c=>!c.haRisposto&&c.reply&&c.reply.auto);
  const fmt=d=>{if(!d)return '—';const x=new Date(d);return x.toLocaleDateString('it-IT',{day:'2-digit',month:'short'})+' '+x.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});};
  const card=(c,isAuto)=>{const r=c.reply||{};return `<div class="card" style="padding:14px 16px;margin-bottom:10px">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between">
        <div><b>${esc(c.azienda||c.email)}</b> <span class="email-cell">${esc(c.email)}</span>
          ${r.via==='spam'?'<span class="chip late" style="margin-left:6px"><span class="d"></span>era nello spam</span>':''}
          ${isAuto?'<span class="chip da" style="margin-left:6px"><span class="d"></span>risposta automatica</span>':''}</div>
        <span class="email-cell">${fmt(r.date)}</span>
      </div>
      ${r.subject?`<div class="email-cell" style="margin-top:4px">${esc(r.subject)}</div>`:''}
      <div style="margin-top:8px;white-space:pre-wrap">${r.snippet?esc(r.snippet)+'…':'<span class="email-cell">Risposta segnata a mano o rilevata prima di questa versione: aprila in Gmail.</span>'}</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <a class="btn sm" href="${gmailLink(r)}" target="_blank" rel="noopener">Apri in Gmail</a>
        <button class="btn sm ghost" onclick="openContact('${c.id}')">Dettagli contatto</button>
        ${isAuto?`<button class="btn sm ghost" onclick="markReply('${c.id}',true)">È una risposta vera</button>`
                :`<button class="btn sm ghost" onclick="markReply('${c.id}',false)" title="Per esempio una risposta automatica: riprende la sequenza">Non è una risposta</button>`}
      </div></div>`;};
  return `
    <div class="helptip" style="margin-bottom:12px">Le risposte vengono cercate in Gmail ogni 3 minuti: nel thread dell'invio e, se non c'è, in tutta la casella (spam compreso) per indirizzo del mittente. Chi risponde esce dalla sequenza e non riceve altri follow-up. Le risposte automatiche (fuori sede) vengono mostrate ma non fermano la sequenza.</div>
    <div class="section-h"><h3>Risposte</h3><span class="count">${real.length}</span><div class="line"></div></div>
    ${real.length?real.map(c=>card(c,false)).join(''):`<div class="empty" style="padding:30px"><h4>Ancora nessuna risposta</h4><p>Appena qualcuno risponde compare qui. Puoi controllare subito con il pulsante <b>Risposte</b> in alto.</p></div>`}
    ${autos.length?`<div class="section-h" style="margin-top:18px"><h3>Risposte automatiche</h3><span class="count">${autos.length}</span><div class="line"></div></div>${autos.map(c=>card(c,true)).join('')}`:''}`;
}
function markReply(id,yes){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  c.haRisposto=!!yes; if(c.reply)c.reply.auto=!yes; c.replySeen=true;
  if(!yes&&!c.reply)c.reply={auto:true,date:new Date().toISOString(),snippet:'',via:'manuale'};
  persist();render();toast(yes?'Segnata come risposta: follow-up fermati':'Sequenza ripresa per '+(c.azienda||c.email),'ok');
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  const tot=state.contacts.length;
  const due=state.contacts.filter(dueToday).length;
  const late=state.contacts.filter(isLate).length;
  const waiting=state.contacts.filter(c=>!c.haRisposto && (c.step||0)>0 && (c.step||0)<state.cadence.length && !isDue(c)).length;
  const replied=state.contacts.filter(c=>c.haRisposto).length;
  const concluded=state.contacts.filter(c=>!c.haRisposto && (c.step||0)>=state.cadence.length).length;
  const backlog=state.contacts.filter(isUnplanned).length;
  const week=[];for(let i=0;i<7;i++)week.push(addDays(t,i));
  const wcount=week.map(d=>state.contacts.filter(c=>{const na=nextAction(c);return na&&sameDay(na.dueDate,d)}).length);
  const maxW=Math.max(1,...wcount), wsum=wcount.reduce((s,x)=>s+x,0);
  const rows=departures();
  const arrivals=state.contacts.filter(c=>c.haRisposto).sort((a,b)=>String(b.reply?.date||'').localeCompare(String(a.reply?.date||''))).slice(0,4);
  const fmtArr=d=>{if(!d)return '';const x=new Date(d);return x.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
  return `
  <div class="bento">
    <div class="span-7">${boardHtml(rows,{title:'Partenze di oggi',
      foot:`<span>${due} da inviare oggi${late?` · <span style="color:#FF8A7E">${late} in ritardo</span>`:''}</span><span class="spacer"></span>
        <button class="btn sm" onclick="go('coda')">Apri la coda invio</button>`})}</div>
    <section class="tile t-lilac span-5" aria-label="Ultime risposte">
      <div class="tile-h"><h3>Ultime risposte</h3><span class="spacer"></span>${replied?`<button class="btn sm" onclick="go('risposte')">Vedi tutte</button>`:''}</div>
      ${arrivals.length?`<ul class="arr-list">${arrivals.map(c=>{const r=c.reply||{};
        return `<li class="arr-item" onclick="go('risposte')">
          <div class="arr-dest">${esc(c.azienda||c.email)}</div><div class="arr-time">${fmtArr(r.date)}</div>
          <div class="arr-snip">${r.snippet?esc(r.snippet):'Risposta segnata a mano: aprila in Gmail.'}</div>
        </li>`;}).join('')}</ul>`
      :`<p class="arr-empty">Ancora nessuna risposta. Le cerco in Gmail ogni 3 minuti e compaiono qui appena arrivano.</p>`}
    </section>
    <section class="tile t-cobalt span-6" aria-label="Prossimi 7 giorni">
      <div class="tile-h"><h3>Prossimi 7 giorni</h3><span class="spacer"></span><span class="sub">${wsum} ${wsum===1?'invio':'invii'}</span></div>
      <div class="wk">${week.map((d,i)=>{const isToday=sameDay(d,t);
        return `<div class="wk-c${isToday?' today':''}" title="${wcount[i]} invii previsti">
          <div class="wk-n">${wcount[i]}</div>
          <div class="wk-bw"><div class="wk-b${wcount[i]?'':' zero'}" style="height:${wcount[i]?Math.max(10,wcount[i]/maxW*100):6}%"></div></div>
          <div class="wk-d">${isToday?'Oggi':d.toLocaleDateString('it-IT',{weekday:'short'})}<b>${d.getDate()}</b></div>
        </div>`;}).join('')}</div>
    </section>
    <div class="span-6 stat-grid">
      <div class="stat-t t-orange"><div class="k">Tasso di risposta</div><div class="row"><div class="v">${tot?Math.round(replied/tot*100):0}%</div><div class="m">${replied} su ${tot}</div></div></div>
      <div class="stat-t t-white"><div class="k">In attesa di risposta</div><div class="row"><div class="v">${waiting}</div><div class="m">follow-up programmati</div></div></div>
      <div class="stat-t t-peach"><div class="k">Da pianificare</div><div class="row"><div class="v">${backlog}</div>${backlog?`<button class="btn sm dark" onclick="go('pianifica')">Pianifica</button>`:'<div class="m">backlog vuoto</div>'}</div></div>
      <div class="stat-t t-ink"><div class="k">Contatti totali</div><div class="row"><div class="v">${tot}</div><div class="m">${concluded} ${concluded===1?'sequenza conclusa':'sequenze concluse'}</div></div></div>
    </div>
  </div>`;
}

/* ---------- TABELLONE PARTENZE ---------- */
function sentToday(c){const h=c.history||[];const last=h[h.length-1];return !!(last&&!last.skipped&&last.date===isoD(today()));}
// partenze di oggi: prima i ritardi, poi quelle in coda oggi, poi quelle già inviate oggi
function departures(){
  const late=state.contacts.filter(isLate).sort((a,b)=>nextAction(a).dueDate-nextAction(b).dueDate);
  const tod=state.contacts.filter(dueToday).sort((a,b)=>(a.step||0)-(b.step||0));
  const gone=state.contacts.filter(c=>sentToday(c)&&!isDue(c));
  return [...late,...tod,...gone];
}
let _flapSeen={};
function boardStatus(c){
  if(sentToday(c)&&!isDue(c)) return {key:'gone',label:'Inviata oggi'};
  return statusOf(c);
}
function flap(c){
  const st=boardStatus(c);const prev=_flapSeen[c.id];_flapSeen[c.id]=st.label;
  return `<span class="flap ${st.key}${prev!==undefined&&prev!==st.label?' flip':''}">${esc(st.label)}</span>`;
}
function boardRow(c,i){
  const na=nextAction(c);const gone=!na||(sentToday(c)&&!isDue(c));
  const h=c.history||[];const lastStep=h.length?h[h.length-1].step:0;
  const stepLabel=gone?(state.cadence[lastStep]?.nome||''):na.label;
  const dd=gone?today():na.dueDate;const lateD=!gone&&dd<today();
  return `<tr class="${gone?'gone':''}" onclick="${gone?`openContact('${c.id}')`:`goCard('${c.id}')`}" title="${escAttr((c.azienda||'')+' — '+(c.email||''))}">
    <td class="b-n">${String(i+1).padStart(2,'0')}</td>
    <td class="b-dest">${esc(c.azienda||c.email)}</td>
    <td class="b-city">${esc(c.sede||'')}</td>
    <td class="b-step"><span>${esc(stepLabel)}</span></td>
    <td class="b-date${lateD?' late':''}">${String(dd.getDate()).padStart(2,'0')}.${String(dd.getMonth()+1).padStart(2,'0')}</td>
    <td class="b-st">${flap(c)}</td>
  </tr>`;
}
function boardHtml(rows,o){
  return `<section class="board" aria-label="${escAttr(o.title)}">
    <div class="board-h"><span class="bt">${esc(o.title)}</span><span class="bsub">${esc(o.sub||'')}</span><span class="spacer"></span>
      ${o.actions||`<span class="clock" id="boardClock">${clockNow()}</span>`}</div>
    ${rows.length?`<table><thead><tr><th class="b-n">N.</th><th>Destinazione</th><th class="b-city">Sede</th><th class="b-step">Step</th><th>Prevista</th><th class="b-st" style="text-align:right">Stato</th></tr></thead>
      <tbody>${rows.map(boardRow).join('')}</tbody></table>`
    :`<div class="board-empty">Nessuna partenza oggi. Le prime email pianificate compariranno qui nel giorno scelto.</div>`}
    ${o.foot?`<div class="board-foot">${o.foot}</div>`:''}
  </section>`;
}
function clockNow(){return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
setInterval(()=>{const el=document.getElementById('boardClock');if(el)el.textContent=clockNow()},15000);
function goCard(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(isLate(c)&&!_showLate)_showLate=true;
  if(state.view!=='coda')go('coda');
  setTimeout(()=>{const el=document.getElementById('card-'+id);if(!el)return;
    el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
    el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');},30);
}

/* ---------- PIANIFICAZIONE ---------- */
let _planSel=new Set();
function viewPianifica(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  const cap=state.config.maxAlGiorno||10;
  const backlog=state.contacts.filter(isUnplanned);
  const planned=state.contacts.filter(c=>!c.haRisposto && (c.step||0)===0 && c.scheduledDate)
    .sort((a,b)=>parseD(a.scheduledDate)-parseD(b.scheduledDate));
  // carico per i prossimi giorni lavorativi (tutti gli step, non solo email 1)
  const loadByDay={};
  state.contacts.forEach(c=>{const na=nextAction(c);if(na&&na.dueDate>=t){const k=isoD(na.dueDate);loadByDay[k]=(loadByDay[k]||0)+1;}});
  const strip=[];let d=new Date(t),guard=0;
  while(strip.length<10 && guard<40){ if(!(state.config.saltaWeekend&&(d.getDay()===0||d.getDay()===6))) strip.push(new Date(d)); d=addDays(d,1);guard++; }
  const defStart=isoD(nextWorkday(addDays(t,1)));

  // strip carico
  const stripHtml=strip.map(dd=>{const k=isoD(dd);const n=loadByDay[k]||0;const over=n>cap;const isToday=sameDay(dd,t);
    return `<div class="load-cell${isToday?' today':''}" title="${n} invii previsti">
      <div class="load-d">${dd.toLocaleDateString('it-IT',{weekday:'short'})}<b>${String(dd.getDate()).padStart(2,'0')}.${String(dd.getMonth()+1).padStart(2,'0')}</b></div>
      <div class="load-bar-wrap"><div class="load-bar${over?' over':''}" style="width:${Math.min(100,n/Math.max(cap,1)*100)}%"></div></div>
      <div class="load-n${over?' over':''}">${n}</div>
    </div>`;}).join('');

  if(!backlog.length && !planned.length){
    return `<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18"/></svg>
      <h4>Tutto pianificato</h4><p>Non ci sono contatti da pianificare. Importa nuovi lead per assegnare le date di contatto.</p>
      <button class="btn primary" onclick="pickFile()">Importa contatti</button></div>`;
  }

  let html=`
  <div class="section-h" style="margin-top:0"><h3>Carico per giorno</h3><span class="email-cell">limite ${cap} al giorno</span><div class="line"></div></div>
  <div class="card" style="overflow:hidden"><div class="load-strip">${stripHtml}</div></div>`;

  if(backlog.length){
    html+=`
    <div class="card plan-bar">
      <div class="plan-bar-row">
        <div class="plan-sel-info"><b id="plan-count">0</b> selezionati su ${backlog.length}
          <button class="btn sm ghost" onclick="planSelAll(true)">Tutti</button>
          <button class="btn sm ghost" onclick="planSelAll(false)">Nessuno</button>
          ${backlog.some(c=>!c.email)?`<button class="btn sm ghost" onclick="planSelNoEmail()">Senza email (${backlog.filter(c=>!c.email).length})</button>`:''}
        </div>
        <span style="flex:1"></span>
        <button class="btn sm del" onclick="askDeleteMany([..._planSel])">Elimina selezionati</button>
      </div>
      <div class="plan-bar-row">
        <div class="plan-group">
          <span class="plan-lbl">Assegna a una data</span>
          <input type="date" id="plan-date" value="${defStart}">
          <button class="btn sm primary" onclick="planSelected(document.getElementById('plan-date').value)">Pianifica selezionati</button>
          <button class="btn sm ghost" onclick="planSelected('${isoD(t)}')">Oggi</button>
          <button class="btn sm ghost" onclick="planSelected('${defStart}')">Domani</button>
        </div>
      </div>
      <div class="plan-bar-row">
        <div class="plan-group">
          <span class="plan-lbl">Distribuzione automatica</span>
          <input type="number" id="plan-perday" value="${cap}" style="width:64px"> al giorno, da
          <input type="date" id="plan-autostart" value="${defStart}">
          <button class="btn sm" onclick="planAuto(false)">Distribuisci selezionati</button>
          <button class="btn sm" onclick="planAuto(true)">Distribuisci tutto il backlog</button>
        </div>
      </div>
    </div>

    <div class="section-h"><h3>Da pianificare</h3><span class="count">${backlog.length}</span><div class="line"></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="plan-allcheck" onclick="planSelAll(this.checked)"></th>
          <th>Azienda</th><th>Email</th><th>Sede</th></tr></thead>
        <tbody>
        ${backlog.map(c=>`<tr onclick="if(event.target.tagName!=='INPUT'){const cb=this.querySelector('input');cb.checked=!cb.checked;togglePlanSel('${c.id}',cb.checked)}">
          <td><input type="checkbox" data-pid="${c.id}" ${_planSel.has(c.id)?'checked':''} onclick="togglePlanSel('${c.id}',this.checked)"></td>
          <td class="az">${esc(c.azienda)}</td>
          <td class="email-cell">${c.email?esc(c.email):'<span class="no-mail">senza email</span>'}</td>
          <td class="email-cell">${esc(c.sede||'—')}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  if(planned.length){
    html+=`<div class="section-h"><h3>Già pianificati (prima email)</h3><span class="count">${planned.length}</span><div class="line"></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Azienda</th><th>Email</th><th>Data prevista</th><th></th></tr></thead>
      <tbody>
      ${planned.map(c=>{const dd=parseD(c.scheduledDate);const lateP=dd<t;
        return `<tr>
          <td class="az">${esc(c.azienda)}</td>
          <td class="email-cell">${esc(c.email)}</td>
          <td><span class="chip ${lateP?'late':(sameDay(dd,t)?'today':'wait')}"><span class="d"></span>${fmtDLong(dd)}</span></td>
          <td style="text-align:right">
            <input type="date" value="${c.scheduledDate}" onchange="rescheduleOne('${c.id}',this.value)" style="margin-right:6px">
            <button class="btn sm ghost danger" onclick="unplan('${c.id}')">Rimetti in backlog</button>
          </td>
        </tr>`;}).join('')}
      </tbody></table></div>`;
  }
  return html;
}
function bindPianifica(){ updatePlanCount(); }
function updatePlanCount(){const el=document.getElementById('plan-count');if(el)el.textContent=_planSel.size;}
function togglePlanSel(id,on){ if(on)_planSel.add(id);else _planSel.delete(id); updatePlanCount(); }
function planSelAll(on){
  const backlog=state.contacts.filter(isUnplanned);
  _planSel=new Set(on?backlog.map(c=>c.id):[]);
  render();
}
function planSelNoEmail(){state.contacts.filter(isUnplanned).forEach(c=>{if(!c.email)_planSel.add(c.id)});render()}
function planSelected(dateISO){
  if(!dateISO){toast('Scegli una data','warn');return}
  if(!_planSel.size){toast('Seleziona prima dei contatti','warn');return}
  let n=0;
  state.contacts.forEach(c=>{ if(_planSel.has(c.id) && isUnplanned(c)){ c.scheduledDate=dateISO; n++; } });
  _planSel.clear();persist();render();
  toast(`${n} contatti pianificati per ${fmtDLong(parseD(dateISO))}`,'ok');
}
function planAuto(all){
  const perDay=Math.max(1, +(document.getElementById('plan-perday')?.value)||state.config.maxAlGiorno||10);
  const startISO=document.getElementById('plan-autostart')?.value || isoD(nextWorkday(addDays(today(),1)));
  let pool=state.contacts.filter(isUnplanned);
  if(!all) pool=pool.filter(c=>_planSel.has(c.id));
  if(!pool.length){toast(all?'Backlog vuoto':'Nessun contatto selezionato','warn');return}
  let day=nextWorkday(parseD(startISO)); let cnt=0, days=0;
  pool.forEach(c=>{
    c.scheduledDate=isoD(day); cnt++;
    if(cnt>=perDay){ cnt=0; days++; day=nextWorkday(addDays(day,1)); }
  });
  _planSel.clear();persist();render();
  toast(`${pool.length} contatti distribuiti (${perDay}/giorno)`,'ok');
}
function rescheduleOne(id,dateISO){const c=state.contacts.find(x=>x.id===id);if(c&&dateISO){c.scheduledDate=dateISO;persist();render();toast('Data aggiornata','ok')}}
function unplan(id){const c=state.contacts.find(x=>x.id===id);if(c){c.scheduledDate=null;persist();render();toast('Rimesso in backlog','warn')}}

/* ---------- CODA INVIO ---------- */
let _showLate=false;
function toggleLate(){_showLate=!_showLate;render()}
function viewCoda(){
  if(!state.contacts.length) return emptyState();
  const cap=state.config.maxAlGiorno||999;
  const todayList=state.contacts.filter(dueToday).sort((a,b)=>(a.step||0)-(b.step||0));
  const lateList=state.contacts.filter(isLate).sort((a,b)=>nextAction(a).dueDate-nextAction(b).dueDate);

  if(!todayList.length && !lateList.length){
    const backlog=state.contacts.filter(isUnplanned).length;
    return `<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
    <h4>Niente da inviare oggi</h4>
    <p>${backlog?`Hai <b>${backlog} contatti da pianificare</b>: assegna loro una data nella sezione Pianificazione e compariranno qui nel giorno scelto.`:'Nessun contatto previsto per oggi. I prossimi follow-up compariranno qui alla data prevista.'}</p>
    <button class="btn primary" onclick="go('${backlog?'pianifica':'calendario'}')">${backlog?'Vai alla pianificazione<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'Vedi il calendario'}</button></div>`;
  }

  let html='';
  // banner ritardi (fuori dal "solo oggi", ma recuperabili a richiesta)
  if(lateList.length){
    html+=`<div class="alert" role="status">
      <svg class="ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4 M12 16h.01"/></svg>
      <div style="flex:1"><b>${lateList.length} follow-up in ritardo</b><div class="email-cell">erano previsti nei giorni scorsi e non sono ancora partiti.</div></div>
      <button class="btn sm" onclick="toggleLate()">${_showLate?'Nascondi':'Mostra e recupera'}</button>
    </div>`;
    if(_showLate){
      html+=`<div class="section-h" style="margin-top:8px"><h3 style="color:var(--late)">In ritardo</h3><span class="count">${lateList.length}</span><div class="line"></div></div>`;
      html+=lateList.map((c,i)=>codaCard(c,i,9999)).join('');
    }
  }

  // intestazione di oggi: tabellone partenze con le azioni di gruppo
  const qrows=[...(_showLate?lateList:[]),...todayList,...state.contacts.filter(c=>sentToday(c)&&!isDue(c))];
  html+=`<div class="qboard">${boardHtml(qrows,{title:'Partenze di oggi',sub:todayList.length+' '+(todayList.length===1?'contatto':'contatti')})}</div>`;
  if(!todayList.length){
    html+=`<div class="email-cell" style="padding:6px 2px 14px">Nessun contatto previsto per oggi.${lateList.length&&!_showLate?' Hai però dei follow-up in ritardo qui sopra.':''}</div>`;
  } else {
    if(cap<todayList.length) html+=`<div class="helptip" style="margin:-4px 0 14px">Hai impostato un limite di <b>${cap} email/giorno</b>: oltre questa soglia i contatti sono marcati "oltre limite", così resti nel ritmo.</div>`;
    html+=`<div class="section-h"><h3>Bozze da rivedere</h3><span class="count">${todayList.length}</span><div class="line"></div></div>`;
    html+=todayList.map((c,idx)=>codaCard(c,idx,cap)).join('');
  }
  return html;
}

        <textarea class="body" data-id="${c.id}" data-f="corpo" placeholder="Testo dell'email...">${esc(d.corpo)}</textarea>
      </div>
      <div class="preview-note">
        <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z M19 10v2a7 7 0 0 1-14 0v-2 M12 19v3"/></svg>
        In calce vengono aggiunte automaticamente la <b>firma</b> e la riga di disiscrizione, in ogni email della sequenza. <button type="button" class="link-btn" onclick="previewEmail('${c.id}',${step})">Vedi anteprima</button>

        Rigenera con AI</button>

        Invia${state.config.testMode?' (test)':''}</button>

}

    <div class="modal-b">
      <div class="email-cell" style="margin-bottom:8px"><b>A:</b> ${esc(c.email||'')} · <b>Oggetto:</b> ${esc(d.oggetto||'')}${step>0?' · risposta nello stesso thread':''}</div>

function bindCodaInputs(){
  document.querySelectorAll('#content [data-f]').forEach(el=>{
    el.addEventListener('input',()=>{
      const c=state.contacts.find(x=>x.id===el.dataset.id);if(!c)return;
      const na=nextAction(c);if(!na)return;const step=na.stepIndex;
      const cur=getDraft(c,step);
      const nd={oggetto:cur.oggetto,corpo:cur.corpo};nd[el.dataset.f]=el.value;
      setDraft(c,step,nd);
      const cntEl=el.previousElementSibling?.querySelector('.cnt');
      if(cntEl)cntEl.textContent=el.value.length+' car.';
    });

async function regen(id,step){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  const btn=document.getElementById('regen-'+id);const old=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Genero...';
  try{
    const r=await generateEmail(c,step);
    setDraft(c,step,r);
    toast('Email rigenerata · ≈ €'+fmtMoney(r.cost||0),'ok');render();
  }catch(e){toast(e.message,'err');btn.disabled=false;btn.innerHTML=old}
}
async function generateAllDrafts(){
  const list=state.contacts.filter(c=>dueToday(c)||(_showLate&&isLate(c)));
  if(!state.config.anthropicKey){toast('Manca la chiave Anthropic','warn');openSettings();return}
  let done=0,batchCost=0;toast('Genero '+list.length+' bozze...','warn');
  for(const c of list){
    const na=nextAction(c);if(!na)continue;
    if(c.drafts&&c.drafts[na.stepIndex]&&!c.drafts[na.stepIndex].seeded)continue;
    // for email1 with a base draft, skip (already good); generate only missing/followups
    if(na.stepIndex===0 && c.oggettoBase) continue;
    try{const r=await generateEmail(c,na.stepIndex);setDraft(c,na.stepIndex,r);batchCost+=(r.cost||0);done++;render();}catch(e){console.warn(e)}
  }
  toast(done+' bozze generate · ≈ €'+fmtMoney(batchCost),'ok');render();
}
function draftReady(c,step){const d=getDraft(c,step);return !!(d.oggetto&&d.corpo&&!(d.seeded&&step>0));}
async function sendContact(c,step){
  if(!c.email) return {err:'senza email'};
  const d=getDraft(c,step);
  if(!d.oggetto||!d.corpo||(d.seeded&&step>0)) return {skip:true};
  const res=await sendEmailGmail(c,step,d.oggetto,d.corpo);
  c.history.push({step,oggetto:d.oggetto,corpo:d.corpo,date:isoD(today())});
  if(step===0){c.anchorDate=isoD(today());c.threadId=res.threadId;c.messageId=res.messageId||c.messageId;}
  else{if(res.threadId)c.threadId=res.threadId;}
  c.dataUltimoInvio=isoD(today());
  c.step=step+1;
  if(c.drafts)delete c.drafts[step];
  persist();
  return {ok:true, simulated:res.simulated};
}
async function doSend(id,step){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(!c.email){toast('Contatto senza email','err');return}
  if(!state.config.testMode && !googleReady()){toast('Connetti Google per inviare (o attiva la modalità test)','warn');connectGoogle();return}
  if(!draftReady(c,step)){toast('Completa oggetto e corpo prima di inviare','warn');return}
  const btn=document.getElementById('send-'+id);const old=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Invio...';
  try{
    const res=await sendContact(c,step);
    toast(res.simulated?`Simulato invio a ${c.azienda}`:`Inviata a ${c.azienda}`,'ok');
    render();
  }catch(e){toast('Invio fallito: '+e.message,'err');btn.disabled=false;btn.innerHTML=old}
}
async function sendAllToday(){
  const list=state.contacts.filter(c=>dueToday(c)||(_showLate&&isLate(c)));
  const ready=list.filter(c=>{const na=nextAction(c);return na&&draftReady(c,na.stepIndex);});
  const notReady=list.length-ready.length;
  if(!ready.length){toast(notReady?'Nessuna bozza pronta: genera prima i testi mancanti':'Coda vuota','warn');return}
  if(!state.config.testMode && !googleReady()){toast('Connetti Google per inviare (o attiva la modalità test)','warn');connectGoogle();return}
  if(!confirm(`Inviare ${ready.length} email${state.config.testMode?' (SIMULATE — modalità test attiva)':''}?${notReady?`\n\n${notReady} verranno saltate perché senza testo.`:''}`))return;
  const btn=document.getElementById('btnSendAll');const old=btn?btn.innerHTML:'';
  if(btn)btn.disabled=true;
  let sent=0,fail=0,skip=notReady;
  for(const c of ready){
    const na=nextAction(c);if(!na){skip++;continue;}
    if(btn)btn.innerHTML=`<span class="spinner"></span> ${sent+1}/${ready.length}`;
    try{ const r=await sendContact(c,na.stepIndex); if(r&&r.ok)sent++; else if(r&&r.skip)skip++; else fail++; }
    catch(e){fail++;console.warn('invio',c.azienda,e.message);}
  }
  render();
  toast(`${sent} email inviate${fail?` · ${fail} errori`:''}${skip?` · ${skip} saltate`:''}`, fail?'warn':'ok');
}
function skipStep(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  const na=nextAction(c);if(!na)return;
  c.history.push({step:na.stepIndex,oggetto:'(saltato)',corpo:'',date:isoD(today()),skipped:true});
  if(na.stepIndex===0)c.anchorDate=isoD(today());
  c.step=na.stepIndex+1;persist();render();toast('Step saltato','warn');
}

/* ---------- CALENDARIO ---------- */
let _calWeek=0; // offset settimane rispetto a questa
function calNav(d){_calWeek+=d;render()}
function calToday(){_calWeek=0;render()}
function startOfWeek(d){const x=new Date(d);const g=(x.getDay()+6)%7;return addDays(x,-g);} // lunedì
function viewCalendario(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  // mappa data->items
  const byDay={};
  let lateCount=0;
  state.contacts.forEach(c=>{const na=nextAction(c);if(!na)return;
    if(na.dueDate<t)lateCount++;
    const k=isoD(na.dueDate);(byDay[k]=byDay[k]||[]).push({c,na});
  });

  const wkStart=startOfWeek(addDays(t,_calWeek*7));
  const days=[];for(let i=0;i<7;i++)days.push(addDays(wkStart,i));
  const wkLabel=`${wkStart.getDate()} ${wkStart.toLocaleDateString('it-IT',{month:'short'})} – ${addDays(wkStart,6).getDate()} ${addDays(wkStart,6).toLocaleDateString('it-IT',{month:'short'})}`;
  const weekTotal=days.reduce((s,d)=>s+((byDay[isoD(d)]||[]).length),0);

  const stepColors=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

  function dayCell(d){
    const k=isoD(d);const items=(byDay[k]||[]);
    const isToday=sameDay(d,t);const isPast=d<t;const wknd=(d.getDay()===0||d.getDay()===6);
    const overdue=isPast&&items.length;
    return `<div class="cal-cell${isToday?' today':''}${wknd?' wknd':''}${isPast&&!isToday?' past':''}">
      <div class="cal-cell-h">
        <span class="cal-dname">${d.toLocaleDateString('it-IT',{weekday:'short'})}</span>
        <span class="cal-dnum">${d.getDate()}</span>
        ${items.length?`<span class="cal-count${overdue?' late':''}">${items.length}</span>`:''}
      </div>
      <div class="cal-items">
        ${items.slice(0,6).map(x=>{
          const col=stepColors[Math.min(x.na.stepIndex,stepColors.length-1)];
          return `<div class="cal-item" title="${escAttr(x.c.azienda+' — '+x.na.label+' ('+x.c.email+')')}" onclick="openContact('${x.c.id}')">
            <span class="cal-dot" style="background:${col}"></span>

function confirmImport(){
  const {headers,rows}=_importData;
  const fields=['email','azienda','sede','nome','ruolo','settore','descrizione','sitoWeb','tipoAsset','oggetto','corpo','disiscrizione','n'];
  const sel={};fields.forEach(f=>{const el=document.getElementById('map-'+f);sel[f]=el?(el.value===''?-1:+el.value):-1});
  const dedup=document.getElementById('dedup-tog').classList.contains('on');
  const seen=new Set(state.contacts.map(c=>c.email.toLowerCase()));
  let added=0,skipped=0;
  rows.forEach(r=>{
    const g=f=>sel[f]>=0?String(r[sel[f]]??'').trim():'';
    const email=g('email');
    if(dedup&&(!email||seen.has(email.toLowerCase()))){skipped++;return}
    if(email)seen.add(email.toLowerCase());
    state.contacts.push(mkContact({
      n:g('n'),azienda:g('azienda'),sede:g('sede'),email,ruolo:g('ruolo'),
      settore:g('settore'),descrizione:g('descrizione'),sitoWeb:g('sitoWeb'),tipoAsset:g('tipoAsset'),
      oggettoBase:g('oggetto'),corpoBase:g('corpo'),
      disiscrizione:g('disiscrizione')||state.templates.disiscrizione,
    }));
    added++;
  });
  persist();closeModal();
  if(added){state.view='pianifica';}
  render();
  toast(`${added} contatti importati — ora pianificali`,'ok');
}

/* ---------- eliminazione in blocco ---------- */
// email eliminate: il foglio Google sincronizzato non deve rimetterle in lista
let _deletedEmails=new Set(load('cfu_deleted_emails',[]));
function rememberDeletedEmail(e){e=String(e||'').trim().toLowerCase();if(e){_deletedEmails.add(e);save('cfu_deleted_emails',[..._deletedEmails]);}}
async function supaDeleteMany(ids){
  if(!supaReady())return {ok:true,local:true};
  setSyncState('saving');
  try{
    for(let i=0;i<ids.length;i+=100){
      const chunk=ids.slice(i,i+100);
      const {error}=await supa.from('contacts').delete().in('id',chunk);
      if(error)throw error;
      chunk.forEach(id=>{_lastPushed.delete(id);rememberDeleted(id)});
    }
    setSyncState('ok');return {ok:true};
  }catch(e){setSyncState('err','Eliminazione fallita');return {ok:false,err:e.message};}
}
function askDeleteMany(ids){
  const set=new Set(ids), list=state.contacts.filter(c=>set.has(c.id));
  if(!list.length){toast('Seleziona prima dei contatti','warn');return}
  const n=list.length, att=list.filter(c=>(c.step||0)>0||c.haRisposto).length, noMail=list.filter(c=>!c.email).length;
  const shown=list.slice(0,8).map(c=>`<li><b>${esc(c.azienda||'(senza nome)')}</b> <span class="email-cell">${esc(c.email||'senza email')}</span></li>`).join('');
  modal(`<div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="del-t">
    <div class="modal-h"><h3 id="del-t">Eliminare ${n} ${n===1?'contatto':'contatti'}?</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
    <div class="modal-b">
      <ul class="del-list">${shown}${n>8?`<li class="email-cell">e altri ${n-8}</li>`:''}</ul>
      ${noMail?`<p class="helptip">${noMail} ${noMail===1?'è senza email':'sono senza email'}.</p>`:''}
      ${att?`<div class="alert" style="margin:0"><span><b>${att} ${att===1?'è già in sequenza o ha risposto':'sono già in sequenza o hanno risposto'}.</b> Eliminandoli perdi anche lo storico delle email inviate.</span></div>`:''}
      <p class="helptip">Vengono tolti anche dal database, per tutto il team, e non tornano dal foglio Google collegato. Non si può annullare.</p>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn del" id="del-go" onclick="deleteMany(${escAttr(JSON.stringify(list.map(c=>c.id)))})">Elimina ${n}</button></div>
  </div>`);
  setTimeout(()=>document.getElementById('del-go')?.focus(),50);
}
async function deleteMany(ids){
  const set=new Set(ids), backup=state.contacts.filter(c=>set.has(c.id));
  closeModal(); if(!backup.length)return;
  state.contacts=state.contacts.filter(c=>!set.has(c.id));
  save(LS.contacts,state.contacts);
  ids.forEach(id=>{_ctSel.delete(id);_planSel.delete(id)});
  render();
  const res=await supaDeleteMany(backup.map(c=>c.id));
  if(!res.ok){
    state.contacts.push(...backup);save(LS.contacts,state.contacts);render();
    toast('Eliminazione non riuscita sul database: '+res.err+'. Nessun contatto è stato tolto.','err');
    return;
  }
  backup.forEach(c=>rememberDeletedEmail(c.email));
  toast(`${backup.length} ${backup.length===1?'contatto eliminato':'contatti eliminati'}`,'ok');
}

async function deleteContact(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Eliminare "${c.azienda||c.email}"?\n\nVerrà rimosso anche dal database Supabase, per tutto il team.`))return;
  const backup={...c};
  state.contacts=state.contacts.filter(x=>x.id!==id);
  save(LS.contacts,state.contacts);
  closeModal();render();
  const res=await supaDelete(id);
  if(!res.ok){
    // il DB ha rifiutato: rimetto il contatto e avviso, così non c'è divergenza silenziosa
    state.contacts.push(backup);save(LS.contacts,state.contacts);render();
    toast('Eliminazione fallita sul database: '+res.err,'err');
  } else {
    rememberDeletedEmail(backup.email);
    toast('Contatto eliminato','ok');
  }
}

/* =======================================================
   ACCESSO — un solo login (Supabase Auth) per tutto Outbound.
   Entra solo chi ha un account in Authentication → Users
   E il cui indirizzo è nella tabella ob_users.
   ======================================================= */
let sb=null;
const auth={inited:false, ready:false, session:null, allowed:null};
function fmtTs(ts,withTime){if(!ts)return '—';const d=new Date(ts);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})+(withTime?' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'')}
function gateBrand(){return `<div class="gate-brand"><div class="logo" aria-hidden="true">${document.querySelector('.brand .logo')?.innerHTML||''}</div><h1>${esc(BRAND.nome)} <span class="suite">Outbound</span></h1></div>`}
function gateMode(){
  if(!APP_DEFAULTS.supabaseUrl||!APP_DEFAULTS.supabaseKey) return 'noconfig';
  if(!auth.ready) return 'loading';
  if(!auth.session) return 'login';
  if(auth.allowed===null) return 'loading';
  if(auth.allowed===false) return 'denied';
  return 'open';
}
function gateUpdate(){
  const m=gateMode(), g=document.getElementById('gate');
  document.body.classList.toggle('locked',m!=='open');
  if(!g||m==='open'){if(g){g.dataset.mode='open';g.innerHTML='';}return}
  const key=m+(m==='denied'?(auth.session?.user?.email||''):'');
  if(g.dataset.mode===key)return;                    // non ridisegno: si perderebbe quello che stai scrivendo
  g.dataset.mode=key;
  let body;
  if(m==='noconfig') body=`<div class="gate-card">${gateBrand()}
    <h2>Manca la configurazione</h2><p class="sub">Apri <span class="code">index.html</span> e compila <span class="code">APP_DEFAULTS</span> in cima al codice: indirizzo e chiave del progetto Supabase di ${esc(BRAND.nome)}. I passi sono nel README.</p></div>`;
  else if(m==='loading') body=`<div class="gate-card">${gateBrand()}<div class="empty" style="padding:24px 0"><span class="spinner"></span><p style="margin-top:14px">Un attimo…</p></div></div>`;
  else if(m==='login') body=`<div class="gate-card">${gateBrand()}
    <h2>Accedi</h2><p class="sub">Usa l'account che ti hanno creato per Outbound.</p>
    <form onsubmit="authLogin(event)">
      <div class="form-row"><label for="au-em">Email</label><input id="au-em" type="email" autocomplete="username" placeholder="la tua email di accesso" autofocus></div>
      <div class="form-row"><label for="au-pw">Password</label><input id="au-pw" type="password" autocomplete="current-password"></div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="btn primary" id="au-btn" type="submit">Accedi</button><span id="au-msg" class="email-cell" role="status" aria-live="polite"></span></div>
    </form></div>`;
  else { const em=esc(auth.session?.user?.email||''); body=`<div class="gate-card">${gateBrand()}
    <h2>Accesso non abilitato</h2><p class="sub"><b>${em}</b> ha fatto l'accesso, ma non è tra le persone abilitate.</p>
    <p class="helptip">Dal SQL Editor di Supabase: <span class="code">insert into public.ob_users (email, nome) values ('${em}', 'Nome');</span></p>
    <button class="btn" style="margin-top:16px" onclick="authLogout()">Esci</button></div>`; }
  g.innerHTML=body;
  if(m==='login')setTimeout(()=>document.getElementById('au-em')?.focus(),50);
}
function supaStop(){ try{ if(_supaChan&&supa)supa.removeChannel(_supaChan); }catch(e){} _supaChan=null; supa=null; }
async function authInit(){
  if(auth.inited)return; auth.inited=true;
  if(!APP_DEFAULTS.supabaseUrl||!APP_DEFAULTS.supabaseKey){render();return}
  if(typeof window.supabase==='undefined'){auth.inited=false;setTimeout(authInit,400);return}
  sb=window.supabase.createClient(APP_DEFAULTS.supabaseUrl,APP_DEFAULTS.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'cfu_auth'}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(!auth.ready)return;                       // la sessione iniziale la gestisce getSession qui sotto
    const was=auth.session&&auth.session.user&&auth.session.user.id;
    auth.session=session;
    if(ev==='SIGNED_OUT'){
      auth.allowed=null; supaStop();
      state.contacts=[]; save(LS.contacts,[]);                 // niente dati rimasti sul dispositivo
      ld.loaded=false;ld.searches=[];ld.leads=[];ld.sel.clear();clearTimeout(ld.pollT);
      ob.loaded=false;ob.rows=[];ob.links=[];
      render();
    }
    else if(ev==='SIGNED_IN' && session && was!==session.user.id){auth.allowed=null;render();setTimeout(authAfterLogin,0);}
  });
  const {data}=await sb.auth.getSession();
  auth.session=data.session; auth.ready=true;
  if(auth.session) await authAfterLogin(); else render();
}
async function authAfterLogin(){
  const {data,error}=await sb.rpc('ob_is_user');
  auth.allowed=(!error&&data===true);
  if(auth.allowed){ initSupabase(); ldLoad({silent:state.view!=='lead'}); }
  render();
}
async function authLogin(ev){
  ev&&ev.preventDefault();
  const email=(document.getElementById('au-em')?.value||'').trim().toLowerCase();
  const pw=document.getElementById('au-pw')?.value||'';
  const out=document.getElementById('au-msg');
  if(!email||!pw){if(out)out.textContent='Scrivi email e password.';return}
  const btn=document.getElementById('au-btn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Accesso…';}
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){
    if(btn){btn.disabled=false;btn.textContent='Accedi';}
    if(out)out.textContent=/invalid login/i.test(error.message)?'Email o password non corretti.':(/not confirmed/i.test(error.message)?'Utente non ancora confermato in Supabase.':'Accesso non riuscito: '+error.message);
  }
}
async function authLogout(){await sb.auth.signOut();toast('Uscito','ok')}
function authLoginView(){return `<div class="empty"><p>Accedi per continuare.</p></div>`}
function authRenderUser(){
  const b=document.getElementById('userBox');if(!b)return;
  if(!auth.session){b.innerHTML='';return}
  const email=auth.session.user?.email||'';
  b.innerHTML=`<span class="email-cell" title="${escAttr(email)}">${esc(email)}</span><button class="btn sm ghost" onclick="authLogout()">Esci</button>`;
}

};
const LD_CATEGORIE=['aziende manifatturiere','metalmeccanica','carpenteria metallica','lavorazioni meccaniche conto terzi','industria alimentare','produzione mobili','materie plastiche','industria tessile','logistica e trasporti','impianti elettrici','impianti termoidraulici','imprese edili','commercio all\'ingrosso','studi commercialisti','studi legali','agenzie immobiliari','studi dentistici','hotel','ristoranti','concessionarie auto','officine meccaniche','cantine vinicole'];
const LD_PREZZO=0.006;   // dollari per azienda letta: Google Maps $0,004 + ricerca email sul sito $0,002 (Apify, ottobre 2026)
const ld={loaded:false,loading:false,searches:[],leads:[],sel:new Set(),view:'tutte',q:'',soloEmail:false,nascondiImportati:true,starting:false,pollT:null,err:''};
function ldForm(){
  if(!state.config.leadForm||typeof state.config.leadForm!=='object') state.config.leadForm={};
  const f=state.config.leadForm;
  if(!f.regione) f.regione='Lombardia';
  if(!Array.isArray(f.luoghi)) f.luoghi=[];
  if(typeof f.altri!=='string') f.altri='';
  if(!Array.isArray(f.categorie)) f.categorie=['metalmeccanica'];
  if(!f.target) f.target=50;
  if(typeof f.budget_auto!=='boolean') f.budget_auto=true;
  if(!f.budget) f.budget=ldSuggestBudget(f);
  ['solo_sito','escludi_chiuse','arricchisci'].forEach(k=>{if(typeof f[k]!=='boolean')f[k]=true});
  if(typeof f.solo_email!=='boolean') f.solo_email=false;
  return f;
}
function ldSaveForm(){save(LS.config,state.config)}
function ldAltri(f){return String(f.altri||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,20)}
function ldResa(f){return f.solo_email?0.55:(f.solo_sito?0.8:0.9)}   // stessa stima del flusso n8n
function ldCostEstimate(f){const az=Math.ceil((+f.target||0)/ldResa(f));return {aziende:az,usd:az*LD_PREZZO}}
function ldSuggestBudget(f){const c=ldCostEstimate(f).usd;return Math.min(5,Math.max(0.3,Math.ceil(c*1.5*10)/10))}
function ldZones(f){const n=f.luoghi.length+ldAltri(f).length;return Math.max(1,n)}
function ldEur(usd){const r=+state.config.eurRate||EUR_DEFAULT;return '€'+(usd*r).toFixed(2).replace('.',',')}
function ldUsd(v){return '$'+(+v||0).toFixed(2).replace('.',',')}
function ldBusy(){return ld.searches.some(s=>s.status==='queued'||s.status==='running')}
function ldFmtAgo(ts){if(!ts)return '';const m=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/60000));return m<1?'meno di un minuto':m===1?'1 minuto':m<60?m+' minuti':Math.floor(m/60)+' h '+(m%60)+' min'}
function ldStuck(s){return (s.status==='running'||s.status==='queued') && Date.now()-new Date(s.started_at||s.created_at).getTime()>75*60000}

/* ---- dati ---- */
async function ldLoad(opts={}){
  if(!sb||!auth.allowed||ld.loading)return;
  ld.loading=true; if(state.view==='lead'&&!opts.silent) render();
  try{
    const [s,l]=await Promise.all([
      sb.from('lead_searches').select('*').order('created_at',{ascending:false}).limit(50),
      sb.from('leads').select('id,azienda,email,sede,ruolo,settore,descrizione,sito_web,telefono,fonte,email_fonte,search_id,importato_il,created_at,data').order('created_at',{ascending:false,nullsFirst:false}).limit(3000),
    ]);
    if(s.error)throw s.error; if(l.error)throw l.error;
    ld.searches=s.data||[]; ld.leads=l.data||[]; ld.loaded=true; ld.err='';
    const live=new Set(ld.leads.map(x=>x.id)); [...ld.sel].forEach(id=>{if(!live.has(id))ld.sel.delete(id)});
  }catch(e){ld.err=e.message||String(e); if(!opts.silent)toast('Lettura ricerche non riuscita: '+ld.err,'err')}
  ld.loading=false;
  ldSchedulePoll();
  if(state.view==='lead') render();
}
function ldSchedulePoll(){
  clearTimeout(ld.pollT); ld.pollT=null;
  if(!ldBusy())return;
  ld.pollT=setTimeout(ldPoll,8000);
}
async function ldPoll(){
  if(!sb||!auth.allowed)return;
  const before=new Map(ld.searches.map(s=>[s.id,s.status])), beforeIns=new Map(ld.searches.map(s=>[s.id,s.inserted||0]));
  const {data,error}=await sb.from('lead_searches').select('*').order('created_at',{ascending:false}).limit(50);
  if(!error&&data){
    ld.searches=data;
    const finished=data.filter(s=>(before.get(s.id)==='queued'||before.get(s.id)==='running')&&(s.status==='done'||s.status==='error'));
    if(finished.length){
      finished.forEach(s=>s.status==='done'
        ?toast(`Ricerca finita: ${s.inserted||0} ${s.inserted===1?'lead nuovo':'lead nuovi'}, spesa ${ldUsd(s.spent_usd)}`,'ok')
        :toast('Ricerca non riuscita: '+(s.error||'errore sconosciuto'),'err'));
      const done=finished.find(s=>s.inserted); if(done){ld.view=done.id;ld.sel.clear();}
      await ldLoad({silent:true}); return;
    }
    if(data.some(s=>s.status==='running'&&(s.inserted||0)>(beforeIns.get(s.id)||0))){await ldLoad({silent:true});return}
    if(state.view==='lead') ldPaintSearches();
  }
  ldSchedulePoll();
}

function ldPaintSummary(){
  const el=document.getElementById('ld-sum');if(el)el.innerHTML=ldSummaryHtml();

}
function ldCanStart(){
  const f=ldForm();
  if(ldBusy())return {ok:false,why:'C\'è già una ricerca in corso: aspetta che finisca.'};
  if(!f.categorie.length)return {ok:false,why:'Scegli almeno una categoria.'};
  if(ldAltri(f).length>10)return {ok:false,why:'Al massimo 10 città o zone scritte a mano.'};
  const t=+f.target; if(!(t>=5&&t<=200))return {ok:false,why:'I lead da trovare vanno da 5 a 200.'};
  const b=+f.budget; if(!(b>=0.1&&b<=5))return {ok:false,why:'Il tetto di spesa va da 0,10 a 5 dollari.'};
  if(b<ldCostEstimate(f).usd*0.8)return {ok:true,warn:`Con questo tetto probabilmente non arrivi a ${t} lead: ne servirebbero circa ${ldUsd(ldCostEstimate(f).usd)}.`};
  return {ok:true};
}
function ldSummaryHtml(){

  return `Cerco ${dove} e mi fermo appena ho <b class="ld-num">${+f.target||0}</b> lead nuovi. Servono circa <b class="ld-num">${c.aziende}</b> aziende da leggere: spesa prevista <b class="ld-num">${ldUsd(c.usd)}</b> (${ldEur(c.usd)}), mai oltre <b class="ld-num">${ldUsd(f.budget)}</b>.`
    +(chk.ok?(chk.warn?`<br><span style="color:var(--warn);font-weight:650">${esc(chk.warn)}</span>`:''):`<br><span style="color:var(--late);font-weight:650">${esc(chk.why)}</span>`);
}
async function ldStart(){
  const chk=ldCanStart(); if(!chk.ok){toast(chk.why,'warn');return}
  const f=ldForm();
  const params={regione:f.regione,province:[...f.luoghi],altri:ldAltri(f),categorie:[...f.categorie],target:Math.round(+f.target),budget_usd:Math.round(+f.budget*100)/100,
    solo_sito:!!f.solo_sito,solo_email:!!f.solo_email,escludi_chiuse:!!f.escludi_chiuse,arricchisci:!!f.arricchisci};
  ld.starting=true; ldPaintSummary(); const b=document.getElementById('ld-go'); if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> Avvio…';}
  const {data,error}=await sb.from('lead_searches').insert({params}).select().single();

  render(); ldSchedulePoll();

function ldRepeat(id){
  const s=ld.searches.find(x=>x.id===id); if(!s)return; const p=s.params||{}, f=ldForm();
  if(p.regione&&LD_REGIONI[p.regione]) f.regione=p.regione;
  const prov=LD_REGIONI[f.regione]||[], suf=', '+f.regione;
  f.luoghi=[]; const altri=[];
  if(Array.isArray(p.province)){f.luoghi=p.province.filter(x=>prov.includes(x));altri.push(...(p.altri||[]))}
  else (p.luoghi||[]).forEach(l=>{const base=l.endsWith(suf)?l.slice(0,-suf.length):null; if(base&&prov.includes(base))f.luoghi.push(base); else altri.push(l)});
  f.altri=altri.join(', '); f.categorie=[...(p.categorie||[])];
  if(p.target)f.target=p.target; else if(p.max_lead)f.target=Math.min(200,Math.max(5,p.max_lead));
  if(p.budget_usd){f.budget=p.budget_usd;f.budget_auto=false}else{f.budget_auto=true;f.budget=ldSuggestBudget(f)}
  ['solo_sito','solo_email','escludi_chiuse','arricchisci'].forEach(k=>{if(typeof p[k]==='boolean')f[k]=p[k]});
  ldSaveForm(); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('Parametri copiati nel modulo: controlla e avvia','ok');
}

function ldContactEmails(){return new Set(state.contacts.map(c=>(c.email||'').trim().toLowerCase()).filter(Boolean))}
function ldLeadState(l,have){
  const e=(l.email||'').trim().toLowerCase();
  if(e&&have.has(e))return 'in';
  if(l.importato_il)return 'gone';
  if(!e)return 'noemail';
  return 'new';
}
function ldRows(){
  const have=ldContactEmails(), q=ld.q.trim().toLowerCase();
  return ld.leads.filter(l=>{
    if(ld.view==='precedenti'){if(l.search_id)return false}
    else if(ld.view!=='tutte'&&l.search_id!==ld.view)return false;
    const st=ldLeadState(l,have);
    if(ld.nascondiImportati&&(st==='in'||st==='gone'))return false;
    if(ld.soloEmail&&!l.email)return false;
    if(q&&![l.azienda,l.email,l.sede,l.settore,l.ruolo].some(x=>String(x||'').toLowerCase().includes(q)))return false;
    return true;
  });
}
function ldSetView(v){ld.view=v;ld.sel.clear();render()}
function ldToggleOpt(k){ld[k]=!ld[k];ld.sel.clear();render()}
function ldSearch(v){ld.q=v;clearTimeout(window._ldq);window._ldq=setTimeout(()=>{render();const i=document.getElementById('ld-q');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},220)}

  if(el){el.hidden=!n;const b=document.getElementById('ld-sel-n');if(b)b.textContent=n;const t=document.getElementById('ld-sel-t');if(t)t.textContent=n===1?'lead scelto':'lead scelti';}
}
function ldExportCsv(all){
  const have=ldContactEmails();
  const rows=all?ldRows():ld.leads.filter(l=>ld.sel.has(l.id));
  if(!rows.length){toast('Scegli almeno un lead da esportare','warn');return}
  const cell=v=>{const t=String(v??'').replace(/\s*[\r\n]+\s*/g,' ');return /[";,]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const byId=Object.fromEntries(ld.searches.map(s=>[s.id,s]));
  const stl={new:'Nuovo',in:'Nei contatti',gone:'Eliminato dai contatti',noemail:'Senza email'};
  const head=['azienda','email','telefono','sito web','sede','settore','referente / ruolo','descrizione','fonte','email: origine','campagna','trovato il','stato'];
  const out=rows.map(l=>[l.azienda,l.email,l.telefono,l.sito_web,l.sede,l.settore,l.ruolo,l.descrizione,l.fonte,l.email_fonte,l.search_id&&byId[l.search_id]?ldSearchLabel(byId[l.search_id]):'Flusso giornaliero',l.created_at?String(l.created_at).slice(0,10):'',stl[ldLeadState(l,have)]].map(cell).join(';'));
  const sch=ld.view!=='tutte'&&ld.view!=='precedenti'?byId[ld.view]:null;
  const nome=(sch?'lead-campagna-'+String(sch.created_at).slice(0,10):'lead-tutte-le-ricerche')+'-esportato-'+isoD(today())+'.csv';
  const url=URL.createObjectURL(new Blob(['\ufeff'+[head.join(';'),...out].join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:nome});
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${rows.length} ${rows.length===1?'lead esportato':'lead esportati'} in CSV`,'ok');
}
async function ldImport(){
  const have=ldContactEmails();
  const pick=ld.leads.filter(l=>ld.sel.has(l.id));
  const ok=[]; let skip=0;
  for(const l of pick){const e=(l.email||'').trim().toLowerCase(); if(!e||have.has(e)||l.importato_il){skip++;continue} have.add(e); ok.push(l)}
  if(!ok.length){toast('Tra quelli scelti non c\'è nessun lead nuovo con email','warn');return}
  ok.forEach(l=>state.contacts.push(mkContact({azienda:l.azienda||'',sede:l.sede||'',email:l.email,ruolo:l.ruolo||'',settore:l.settore||'',descrizione:l.descrizione||'',sitoWeb:l.sito_web||''})));
  persist();
  const now=new Date().toISOString();
  ok.forEach(l=>l.importato_il=now); ld.sel.clear(); render();
  const {error}=await sb.from('leads').update({importato_il:now}).in('id',ok.map(l=>l.id));
  if(error) console.warn('importato_il',error.message);
  toast(`${ok.length} ${ok.length===1?'lead aggiunto':'lead aggiunti'} ai contatti${skip?` · ${skip} saltati (senza email o già presenti)`:''}. Li trovi in Pianificazione.`,'ok');
}

        <form class="ld-add" onsubmit="ldAddCat(event)"><div class="form-row" style="flex:1"><label for="ld-cat-new" class="sr-only">Nuova categoria</label><input id="ld-cat-new" placeholder="Un'altra categoria, come la scriveresti su Google Maps (es. tornerie)"></div><button class="btn" type="submit">${LD_I.plus}Aggiungi</button></form>
      </div>
      <div class="form-row"><label for="ld-tgt">Lead nuovi da trovare</label>
        <input id="ld-tgt" type="number" min="5" max="200" step="5" value="${escAttr(f.target)}" oninput="ldSetQuiet('target',+this.value)">
        <span class="hint">Da 5 a 200. Le aziende già nei lead o nei contatti non contano: la ricerca va avanti zona per zona finché non li trova.</span></div>
      <div class="form-row"><label for="ld-bud">Tetto di spesa su Apify, in dollari</label>
        <input id="ld-bud" type="number" min="0.1" max="5" step="0.1" value="${escAttr(f.budget)}" oninput="ldSetQuiet('budget',+this.value)">
        <span class="hint">${f.budget_auto?'Calcolato da solo sui lead da trovare.':`Impostato a mano. <button type="button" class="ld-link" onclick="ldBudgetAuto()">Torna al valore consigliato</button>.`} Apify si ferma da solo a questa cifra: non si può spendere di più.</span></div>
      <div class="full ld-opts" role="group" aria-label="Filtri">
        <label><input type="checkbox" ${f.solo_sito?'checked':''} onchange="ldSetQuiet('solo_sito',this.checked)"> Solo aziende con sito web</label>
        <label><input type="checkbox" ${f.solo_email?'checked':''} onchange="ldSetQuiet('solo_email',this.checked)"> Solo se l'email è già stata trovata</label>
        <label><input type="checkbox" ${f.escludi_chiuse?'checked':''} onchange="ldSetQuiet('escludi_chiuse',this.checked)"> Escludi attività chiuse</label>
        <label><input type="checkbox" ${f.arricchisci?'checked':''} onchange="ldSetQuiet('arricchisci',this.checked)"> Descrizione e referente con AI</label>
      </div>
      <div class="full ld-sum">
        <p id="ld-sum" aria-live="polite">${ldSummaryHtml()}</p>
        <button class="btn primary" id="ld-go" onclick="ldStart()" ${chk.ok&&!ld.starting?'':'disabled'}>${LD_I.search}Avvia ricerca</button>
      </div>
    </div>
  </div>`;
}
function ldStatusChip(s){
  if(ldStuck(s)) return '<span class="chip late"><span class="d"></span>Bloccata</span>';
  if(s.status==='queued') return '<span class="chip wait"><span class="d"></span>In partenza</span>';
  if(s.status==='running'){const z=(s.plan&&s.plan.zones||[]).length;return `<span class="chip today"><span class="d"></span>In corso${z?` · zona ${Math.min(z,(s.zone_done||0)+1)} di ${z}`:''}</span>`;}
  if(s.status==='error') return '<span class="chip late"><span class="d"></span>Non riuscita</span>';
  return '<span class="chip reply"><span class="d"></span>Finita</span>';
}
function ldSearchLabel(s){
  const p=s.params||{}, cats=(p.categorie||[]).join(', '), luoghi=Array.isArray(p.province)?[...p.province,...(p.altri||[])]:(p.luoghi||[]).map(l=>l.replace(/, [^,]+$/,''));
  return `${cats||'—'} · ${luoghi.length?(luoghi.length>3?luoghi.slice(0,3).join(', ')+' e altri '+(luoghi.length-3):luoghi.join(', ')):(p.regione||'')}`;
}
function ldSearchRows(){
  return ld.searches.slice(0,12).map(s=>{
    const has=s.status!=='queued', p=s.params||{};
    const obiettivo=p.target?`${p.target} lead · tetto ${ldUsd(p.budget_usd)}`:(p.max_lead?`max ${p.max_lead} lead`:'');
    return `<tr>
      <td class="az"><div>${esc(ldSearchLabel(s))}</div><div class="ld-sub">${esc(fmtTs(s.created_at,true))}${obiettivo?' · '+esc(obiettivo):''}${p.arricchisci?' · con AI':''}</div>${s.note||s.error?`<div class="ld-sub${s.error?' ld-err':''}">${esc((s.error?s.error+(s.note?' · '+s.note:''):s.note).replace(/\$(\d+)\.(\d+)/g,'$$$1,$2'))}</div>`:''}</td>
      <td>${ldStatusChip(s)}</td>
      <td class="tnum">${has?s.found??0:'—'}</td><td class="tnum">${has?`<b>${s.inserted??0}</b>`:'—'}</td><td class="tnum">${has?s.duplicates??0:'—'}</td><td class="tnum" style="white-space:nowrap">${has?ldUsd(s.spent_usd):'—'}</td>
      <td style="text-align:right;white-space:nowrap">${s.inserted?`<button class="btn sm" onclick="ldSetView('${s.id}');document.getElementById('ld-res')?.scrollIntoView({behavior:'smooth'})">Vedi lead</button>`:''}<button class="btn sm ghost" onclick="ldRepeat('${s.id}')">Ripeti</button></td>
    </tr>`;}).join('');
}
function ldPaintSearches(){const tb=document.getElementById('ld-s-body');if(tb)tb.innerHTML=ldSearchRows();const hc=heroCopy();const t=document.getElementById('viewTitle');if(t)t.textContent=hc.t;const v=document.getElementById('viewLede');if(v)v.textContent=hc.l}
function ldSearchesView(){
  if(!ld.searches.length) return '';
  return `<div class="section-h"><h3>Ricerche</h3><span class="count">${ld.searches.length}</span><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Cosa e dove</th><th>Stato</th><th>Lette</th><th>Nuove</th><th>Doppioni</th><th>Spesa</th><th></th></tr></thead><tbody id="ld-s-body">${ldSearchRows()}</tbody></table></div>
  <p class="helptip" style="margin-top:10px"><b>Lette</b>: aziende lette da Google Maps (si pagano tutte, circa $0,006 l'una) · <b>Nuove</b>: lead salvati · <b>Doppioni</b>: già nei lead o nei contatti · <b>Spesa</b>: costo reale su Apify. Se una run viene fermata o scade, quello che ha trovato viene salvato lo stesso.</p>`;
}
function ldResultsView(){
  const have=ldContactEmails(), rows=ldRows(), shown=rows.slice(0,500);
  const selectable=shown;
  const allSel=selectable.length&&selectable.every(l=>ld.sel.has(l.id));
  const opts=[`<option value="tutte"${ld.view==='tutte'?' selected':''}>Tutte le ricerche</option>`]
    .concat(ld.searches.filter(s=>s.inserted).map(s=>`<option value="${s.id}"${ld.view===s.id?' selected':''}>${esc(fmtTs(s.created_at,true))} · ${esc(ldSearchLabel(s).slice(0,70))}</option>`))
    .concat(ld.leads.some(l=>!l.search_id)?[`<option value="precedenti"${ld.view==='precedenti'?' selected':''}>Lead del flusso giornaliero</option>`]:[]);
  const stChip=st=>st==='in'?'<span class="chip done"><span class="d"></span>Nei contatti</span>':st==='gone'?'<span class="chip stop"><span class="d"></span>Eliminato dai contatti</span>':st==='noemail'?'<span class="chip da"><span class="d"></span>Senza email</span>':'<span class="chip seq"><span class="d"></span>Nuovo</span>';
  const site=u=>{if(!u)return '';try{const h=new URL(u).hostname.replace(/^www\./,'');return `<a class="ld-site" href="${escAttr(u)}" target="_blank" rel="noopener noreferrer">${esc(h)} ${LD_I.ext}</a>`}catch(e){return ''}};
  return `<div class="section-h" id="ld-res"><h3>Lead trovati</h3><span class="count">${rows.length}</span><div class="line"></div></div>
  <div class="filters">
    <div class="search">${LD_I.search.replace('class="ico"','class="ico" style="width:17px;height:17px;color:var(--faint)"')}<input id="ld-q" placeholder="Cerca azienda, email, città, settore…" value="${escAttr(ld.q)}" oninput="ldSearch(this.value)" aria-label="Cerca tra i lead"></div>
    <div class="form-row ld-which"><label for="ld-which" class="sr-only">Ricerca</label><select id="ld-which" aria-label="Campagna" onchange="ldSetView(this.value)">${opts.join('')}</select></div>
  </div>
  <div class="filters ld-opts">
    <label><input type="checkbox" ${ld.nascondiImportati?'checked':''} onchange="ldToggleOpt('nascondiImportati')"> Nascondi quelli già nei contatti</label>
    <label><input type="checkbox" ${ld.soloEmail?'checked':''} onchange="ldToggleOpt('soloEmail')"> Solo con email</label>
    <span class="spacer"></span><button class="btn sm" onclick="ldExportCsv(true)" ${rows.length?'':'disabled'} title="Esporta tutti i lead che vedi con questi filtri">${LD_I.ext}Esporta tutti (${rows.length})</button>
  </div>
  ${shown.length?`<div class="table-wrap"><table class="ld-table"><thead><tr>
      <th style="width:34px"><input type="checkbox" aria-label="Scegli tutti i lead" ${allSel?'checked':''} ${selectable.length?'':'disabled'} onclick="ldSelAll(this.checked)"></th>
      <th>Azienda</th><th>Settore</th><th>Sede</th><th>Email</th><th>Telefono</th><th>Stato</th></tr></thead><tbody>
    ${shown.map(l=>{const st=ldLeadState(l,have);return `<tr>
      <td><input type="checkbox" aria-label="Scegli ${escAttr(l.azienda||'lead')}" ${ld.sel.has(l.id)?'checked':''} onclick="ldSel('${l.id}',this.checked)"></td>
      <td class="az"><div>${esc(l.azienda||'—')}</div>${site(l.sito_web)}${l.ruolo?`<div class="ld-sub">${esc(l.ruolo)}</div>`:''}${l.descrizione?`<div class="ld-sub" title="${escAttr(l.descrizione)}">${esc(l.descrizione)}</div>`:''}</td>
      <td class="email-cell">${esc(l.settore||'—')}</td>
      <td class="email-cell">${esc(l.sede||'—')}</td>
      <td class="email-cell">${l.email?`${esc(l.email)}${l.email_fonte==='dedotta-ai'?' <span class="ld-tag" title="Indirizzo ricostruito dall\'AI dal nome del referente: il dominio riceve posta, la casella non è verificata">dedotta</span>':''}`:'—'}</td>
      <td class="email-cell tnum" style="white-space:nowrap">${l.telefono?`<a href="tel:${escAttr(l.telefono.replace(/\s+/g,''))}" style="color:inherit">${esc(l.telefono)}</a>`:'—'}</td>
      <td>${stChip(st)}</td></tr>`}).join('')}
  </tbody></table></div>${rows.length>500?`<p class="helptip" style="margin-top:10px">Mostro i primi 500 di ${rows.length}: usa la ricerca o scegli una ricerca specifica.</p>`:''}
  <div class="ld-selbar" id="ld-selbar" ${ld.sel.size?'':'hidden'}><span class="plan-sel-info"><b id="ld-sel-n">${ld.sel.size}</b> <span id="ld-sel-t">${ld.sel.size===1?'lead scelto':'lead scelti'}</span></span><span class="spacer"></span><button class="btn sm ghost" onclick="ld.sel.clear();render()">Annulla</button><button class="btn" onclick="ldExportCsv()">${LD_I.ext}Esporta in CSV</button><button class="btn primary" onclick="ldImport()">${LD_I.plus}Aggiungi ai contatti</button></div>`
  :`<div class="empty">${LD_I.search}<h4>${ld.leads.length?'Nessun lead con questi filtri':'Ancora nessun lead'}</h4><p>${ld.leads.length?'Prova a togliere un filtro o a cambiare ricerca.':'Avvia la prima ricerca qui sopra: i risultati compaiono qui appena n8n ha finito.'}</p></div>`}
  <p class="helptip" style="margin-top:12px">Aggiungendo un lead ai contatti entra in Outbound come “da pianificare”, con descrizione e sito per scrivere l'email. I lead senza email restano qui: puoi chiamarli o cercare l'indirizzo sul sito.</p>`;
}

/* =======================================================
   STATISTICHE OUTBOUND — anonime (funzione ob-track)
   ======================================================= */
const ob={loaded:false,loading:false,err:'',period:'30',rows:[],links:[],at:0};
async function obLoad(force){
  if(!supaReady()){ob.err='Database non collegato';render();return}
  if(ob.loading||(!force&&ob.loaded&&Date.now()-ob.at<60000))return;
  ob.loading=true; if(state.view==='stats')render();
  const since=ob.period==='all'?null:new Date(Date.now()-(+ob.period)*864e5).toISOString();
  const [a,b]=await Promise.all([supa.rpc('outbound_stats',{p_since:since}),supa.rpc('outbound_link_stats',{p_since:since})]);
  ob.loading=false;
  if(a.error||b.error){ob.err=(a.error||b.error).message;}
  else {ob.err='';ob.rows=a.data||[];ob.links=b.data||[];ob.loaded=true;ob.at=Date.now();}
  if(state.view==='stats')render();
}
function obSetPeriod(p){ob.period=p;ob.loaded=false;obLoad(true)}
function obPct(n,base){return base?Math.round(n/base*100)+'%':'—'}
function obTot(){return ob.rows.reduce((t,r)=>({sent:t.sent+ +r.sent,opens:t.opens+ +r.opens_unique,clicks:t.clicks+ +r.clicks_unique,bots:t.bots+ +r.bots}),{sent:0,opens:0,clicks:0,bots:0})}
// risposte: dai contatti (non sono dati anonimi, ma restano dentro Outbound come già oggi)
function obReplies(){
  const since=ob.period==='all'?null:new Date(Date.now()-(+ob.period)*864e5);
  const inRange=c=>!since||(c.reply&&c.reply.date&&new Date(c.reply.date)>=since);
  const real=state.contacts.filter(c=>c.haRisposto&&!(c.reply&&c.reply.auto)&&inRange(c));
  const byStep={};real.forEach(c=>{const sent=(c.history||[]).filter(h=>!h.skipped);const st=sent.length?Math.max(...sent.map(h=>h.step)):0;byStep[st]=(byStep[st]||0)+1});
  return {n:real.length,byStep};
}
function obHeroCopy(){
  if(!ob.loaded) return {t:'Statistiche.',l:'Quante email della sequenza vengono aperte e cliccate, in forma anonima.'};
  const t=obTot();
  if(!t.sent) return {t:'Ancora nessun dato.',l:'I numeri partono dai prossimi invii reali: ogni email della sequenza viene contata in forma anonima.'};
  return {t:`${obPct(t.opens,t.sent)} delle email aperte.`,l:`${t.sent} email contate ${ob.period==='all'?'da quando sono attive le statistiche':'negli ultimi '+ob.period+' giorni'} · ${obPct(t.clicks,t.sent)} con almeno un clic.`};
}
function viewStats(){
  if(!ob.loaded&&!ob.loading&&!ob.err) setTimeout(()=>obLoad(),0);
  const seg=`<div class="filters"><div class="seg" role="group" aria-label="Periodo">
    ${[['7','Ultimi 7 giorni'],['30','Ultimi 30 giorni'],['90','Ultimi 90 giorni'],['all','Da sempre']].map(([k,l])=>`<button class="fbtn ${ob.period===k?'on':''}" aria-pressed="${ob.period===k}" onclick="obSetPeriod('${k}')">${l}</button>`).join('')}
  </div></div>`;
  if(ob.err) return seg+`<div class="empty"><h4>Statistiche non disponibili</h4><p>${esc(ob.err)}</p><button class="btn" onclick="obLoad(true)">Riprova</button></div>`;
  if(!ob.loaded) return seg+`<div class="empty"><span class="spinner"></span><p style="margin-top:14px">Carico le statistiche…</p></div>`;
  const t=obTot(), rep=obReplies();
  const off=!state.config.formatoHtml?'il formato "come Gmail" è spento':(!state.config.obTrackOpen&&!state.config.obTrackClick?'aperture e clic sono spenti':'');
  const warn=off?`<div class="alert"><span><b>Statistiche in pausa:</b> ${off} nelle Impostazioni, quindi le nuove email non vengono contate.</span></div>`:'';
  if(!t.sent) return seg+warn+`<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18 M7 16v-5 M12 16V8 M17 16v-8"/></svg><h4>Ancora nessun dato</h4><p>I numeri partono dai prossimi invii reali (non in modalità test). Ogni email della sequenza riceve un codice casuale: si contano le aperture e i clic, non chi li fa.</p></div>`;
  const rows=ob.rows.map(r=>{const st=state.cadence[r.step]?.nome||('Step '+(r.step+1));
    return `<tr><td class="az">${esc(st)}</td><td class="tnum">${r.sent}</td><td class="tnum">${obPct(r.opens_unique,r.sent)} <span class="email-cell">(${r.opens_unique})</span></td><td class="tnum">${obPct(r.clicks_unique,r.sent)} <span class="email-cell">(${r.clicks_unique})</span></td><td class="tnum">${rep.byStep[r.step]||0}</td></tr>`}).join('');
  return seg+warn+`
  <div class="nl-kpis">
    <div class="stat-t t-white"><div class="k">Email contate</div><div class="row"><div class="v">${t.sent}</div><div class="m">tutti gli step</div></div></div>
    <div class="stat-t t-white"><div class="k">Aperture stimate</div><div class="row"><div class="v">${obPct(t.opens,t.sent)}</div><div class="m">${t.opens} email aperte</div></div></div>
    <div class="stat-t t-white"><div class="k">Con almeno un clic</div><div class="row"><div class="v">${obPct(t.clicks,t.sent)}</div><div class="m">${t.clicks} email</div></div></div>
  </div>
  <div class="section-h"><h3>Per step della sequenza</h3><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Step</th><th>Inviate</th><th>Aperte</th><th>Con clic</th><th>Risposte</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${ob.links.length?`<div class="section-h"><h3>Link cliccati</h3><span class="count">${ob.links.length}</span><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Link</th><th>Email</th><th>Clic</th></tr></thead><tbody>${ob.links.map(l=>`<tr><td class="az" style="word-break:break-all">${esc(l.url)}</td><td class="tnum">${l.clicks_unique}</td><td class="tnum">${l.clicks_total}</td></tr>`).join('')}</tbody></table></div>`:''}
  <p class="helptip" style="margin-top:14px">Numeri anonimi: ogni email ha un codice casuale che non viene salvato con il contatto, quindi si sa quante email sono state aperte o cliccate, non da chi. Le aperture sono una stima: Apple Mail le gonfia, chi blocca le immagini non viene contato, e contano anche le volte che riapri tu un'email dalla cartella "Inviati" di Gmail. Le risposte invece vengono dai contatti e sono esatte.${t.bots?` Esclusi ${t.bots} accessi automatici di filtri antispam.`:''}</p>`;
}

/* ---- boot ---- */
(function boot(){
  const th=load(LS.theme,null)||(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',th);
  initGoogle();
  // ripristina la sessione Google salvata; se scaduta, tenta un rinnovo silenzioso
  if(state.config.googleClientId){
    if(googleReady()){ scheduleRefresh(); setTimeout(()=>afterGoogleAuth(),300); }
    else if(state.google.email){ setTimeout(()=>refreshToken(),800); }
  }
  authInit();
  render();
})();
</script>
